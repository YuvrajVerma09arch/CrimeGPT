version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: crimegpt
      POSTGRES_USER: crimegpt
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimegpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://crimegpt:${DB_PASSWORD}@db:5432/crimegpt
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      TRANSLATION_SERVICE_URL: http://translation:8001
      UPLOAD_DIR: /app/uploads
      CHROMA_DB_PATH: /app/chroma_db
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000

  # --- Optional services (start with: docker compose --profile full up) ---

  translation:
    build: ./backend/translation_service
    profiles: ["full"]
    ports:
      - "8001:8001"
    # Heavy model — loads on startup, stays warm

  celery:
    build: ./backend
    profiles: ["full"]
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://crimegpt:${DB_PASSWORD}@db:5432/crimegpt
      REDIS_URL: redis://redis:6379
      USE_CELERY: "true"
    depends_on:
      - redis
      - db

volumes:
  pgdata:
